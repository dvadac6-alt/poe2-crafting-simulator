<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流放之路2 · 做装模拟器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════ 顶栏 ═══════════ -->
<header id="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32"><use href="#i-anvil"/></svg>
    <div>
      <h1>流放之路 2 <span>做装模拟器</span></h1>
      <p class="patch">数据版本 0.5 · poe2db / POE2_HTC</p>
    </div>
  </div>
  <div id="topbar-status" class="topbar-status"></div>
</header>

<main>

<!-- ═══════════ 第一步：选择武器类型 ═══════════ -->
<section id="screen-class" class="screen active">
  <div class="hero">
    <h2>选择要制作的武器类型</h2>
    <p>完整的词缀池 / 权重 / 档位数据，与游戏 0.5 版本一致</p>
  </div>
  <div id="class-grid" class="class-grid"></div>
</section>

<!-- ═══════════ 第二步：选择基底 ═══════════ -->
<section id="screen-base" class="screen">
  <div class="step-head">
    <button class="btn ghost back" data-nav="screen-class">‹ 换武器类型</button>
    <h2 id="base-title">选择基底</h2>
    <div class="base-tools">
      <input id="base-search" type="text" placeholder="搜索基底（中/英文）…">
      <select id="base-sort">
        <option value="level">按等级</option>
        <option value="dps">按基础 DPS</option>
        <option value="aps">按攻速</option>
        <option value="crit">按暴击</option>
      </select>
    </div>
  </div>
  <div id="base-grid" class="base-grid"></div>
</section>

<!-- ═══════════ 第三步：做装台 ═══════════ -->
<section id="screen-craft" class="screen">
  <div class="step-head">
    <button class="btn ghost back" data-nav="screen-base">‹ 换基底</button>
    <div class="craft-title">
      <h2 id="craft-title">做装台</h2>
      <div class="ilvl-box">
        <label>物品等级</label>
        <input id="ilvl-input" type="number" min="1" max="86" value="75">
        <button id="ilvl-82" class="mini" title="T17 副本掉落等级">82</button>
        <button id="ilvl-max" class="mini" title="最高 86">86</button>
      </div>
    </div>
    <div class="cost-box" title="本次做装实际消耗的通货统计">
      <span class="cost-label">已用 <b id="usage-steps">0</b> 步</span>
      <div id="usage-list" class="usage-list"></div>
    </div>
  </div>

  <div class="craft-layout">
    <!-- 左：通货 -->
    <aside class="panel currency-panel">
      <div class="panel-title">做装通货</div>
      <div class="tier-switch" id="tier-switch">
        <button data-tier="base" class="on">普通</button>
        <button data-tier="greater" title="只 roll 词缀档位需求 ≥35 的高档位">高级</button>
        <button data-tier="perfect" title="只 roll 词缀档位需求 ≥50 的最高档位">完美</button>
      </div>
      <div id="currency-list"></div>
      <div class="omen-box" id="omen-box">
        <div class="omen-head">搭配预兆 <span class="hint">（点击切换 · 再点取消）</span></div>
        <div id="omen-list" class="omen-list"></div>
      </div>
    </aside>

    <!-- 中：物品卡片 -->
    <div class="panel item-panel">
      <div id="item-card-wrap">
        <div id="item-card" class="item-card rarity-normal"></div>
      </div>
      <div class="item-actions">
        <button id="btn-undo" class="btn">↶ 撤销</button>
        <button id="btn-reset" class="btn danger">重置物品</button>
      </div>
      <div class="panel-title" style="margin-top:14px">做装日志</div>
      <div id="craft-log" class="craft-log"></div>
    </div>

    <!-- 右：概率 -->
    <aside class="panel prob-panel">
      <div class="panel-title">结果预测 <span class="hint" id="prob-sub"></span></div>
      <div id="prob-list" class="prob-list"></div>
    </aside>
  </div>
</section>

</main>

<footer>
  <p>数据来源 poe2db.tw（0.5）· POE2_HTC（AGPL-3.0）· 精华/预兆机制参照引擎实现 · 价格为种子估值，仅供模拟参考</p>
</footer>

<!-- 预示结果弹窗 -->
<div id="foresee-modal" class="modal hidden">
  <div class="modal-card foresee-card">
    <div class="modal-head">
      <h3 id="foresee-title"></h3>
      <button class="modal-close" id="fv-x">✕</button>
    </div>
    <div id="foresee-body" class="foresee-body"></div>
    <div class="foresee-actions">
      <button id="fv-apply" class="btn primary">✓ 应用结果</button>
      <button id="fv-cancel" class="btn danger">✕ 放弃（不消耗）</button>
    </div>
  </div>
</div>

<!-- 精华选择弹窗 -->
<div id="essence-modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3>选择精华</h3>
      <button class="modal-close" id="essence-close">✕</button>
    </div>
    <div id="essence-grid" class="essence-grid"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- SVG 图标库 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d9a0"/><stop offset="1" stop-color="#b98a3e"/>
    </linearGradient>
  </defs>
  <!-- 锤与砧（品牌） -->
  <symbol id="i-anvil" viewBox="0 0 32 32">
    <path fill="url(#g-gold)" d="M6 8h14l4 4h-6l2 4H10l2-4H8z"/>
    <path fill="url(#g-gold)" d="M8 20h16l3 6H5z"/>
  </symbol>
  <!-- 武器类图标 -->
  <symbol id="ic-bow" viewBox="0 0 48 48">
    <path d="M12 6c14 4 22 12 26 26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M12 6l26 26" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 3"/>
    <path d="M38 6C24 10 16 18 12 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M38 6L12 32" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 3"/>
    <path d="M8 40l6-6M4 44l4-4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-spear" viewBox="0 0 48 48">
    <path d="M40 8L14 34" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M40 8l-2 10-8-8z" fill="currentColor"/>
    <path d="M12 32l4 4-8 8-4-4z" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M18 26l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-crossbow" viewBox="0 0 48 48">
    <path d="M10 14h28M10 34h28" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M38 10L24 24 10 10M38 38L24 24 10 38" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="21" y="14" width="6" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <path d="M24 24h12" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2.5"/>
  </symbol>
  <symbol id="ic-quarterstaff" viewBox="0 0 48 48">
    <path d="M24 4v40" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="24" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="24" cy="38" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M18 20l12 8M30 20l-12 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-staff" viewBox="0 0 48 48">
    <path d="M18 44L34 12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="36" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <path d="M36 2v3M36 13v3M29 9h3M40 9h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M22 34l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-wand" viewBox="0 0 48 48">
    <path d="M10 40L30 16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M32 14l6-6M34 8l-2 2M38 12l2-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M33 7l1.5 3L38 11l-3 1.5L33 16l-1.5-3.5L28 11l3.5-1z" fill="currentColor"/>
  </symbol>
  <symbol id="ic-mace1h" viewBox="0 0 48 48">
    <path d="M24 44V20" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="24" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.6"/>
    <path d="M24 4v3M24 17v3M16 12h3M29 12h3M18 6l2 2M28 16l2 2M30 6l-2 2M20 16l-2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-mace2h" viewBox="0 0 48 48">
    <path d="M24 46V22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <rect x="12" y="4" width="24" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2.6"/>
    <path d="M16 4v18M32 4v18M12 10h24M12 16h24" stroke="currentColor" stroke-width="1.4"/>
  </symbol>
  <symbol id="ic-sceptre" viewBox="0 0 48 48">
    <path d="M24 44V16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="24" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <path d="M24 2v2M17 10h2M29 10h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M20 22h8l-2 8h-4z" fill="none" stroke="currentColor" stroke-width="2"/>
  </symbol>
  <!-- 通货图标（球体） -->
  <symbol id="orb" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="15" fill="url(#orb-fill)" stroke="url(#g-gold)" stroke-width="1.6"/>
    <ellipse cx="15" cy="14" rx="5" ry="3" fill="#ffffff" opacity=".5" transform="rotate(-25 15 14)"/>
    <text x="20" y="25" text-anchor="middle" font-size="12" fill="#101010" font-weight="700" id="orb-glyph">◆</text>
  </symbol>
</svg>

<script src="data.js"></script>
<script src="assets.js"></script>
<script src="i18n_mods.js"></script>
<script src="engine.js"></script>
<script src="stats.js"></script>
<script src="app.js"></script>
</body>
</html>
