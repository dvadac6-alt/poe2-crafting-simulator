<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>图标预览</title>
<link rel="stylesheet" href="style.css">
<style>
body { background: #0b0a08; color: #d8d2c4; padding: 24px; font-family: "Microsoft YaHei", sans-serif; }
h2 { color:#d9ab5c; margin: 18px 0 10px; }
.grid { display:flex; flex-wrap:wrap; gap:12px; }
.cell { display:flex; flex-direction:column; align-items:center; gap:6px; width:96px;
  background:rgba(24,20,15,.8); border:1px solid rgba(190,150,80,.2); border-radius:10px; padding:10px 6px; }
.cell img { width:44px; height:44px; }
.cell.wide img { width:96px; height:auto; }
.cell span { font-size:11px; color:#9c9484; text-align:center; line-height:1.3; }
</style>
</head>
<body>
<h2>通货（8）</h2><div class="grid" id="g-cur"></div>
<h2>预兆（13）</h2><div class="grid" id="g-omen"></div>
<h2>精华（21）</h2><div class="grid" id="g-ess"></div>
<h2>武器基底插画（抽样）</h2><div class="grid" id="g-wep"></div>
<script src="assets.js"></script>
<script src="i18n_mods.js"></script>
<script src="engine.js"></script>
<script src="stats.js"></script>
<script src="data.js"></script>
<script>
const A = window.POE2_ASSETS, D = window.POE2_DATA, E = window.POE2_ENGINE;
const ZH = { transmutation:"蜕变石", augmentation:"增幅石", regal:"富豪石", alchemy:"点金石", exalted:"崇高石", chaos:"混沌石", annulment:"剥离石", essence:"精华", desecrated:"亵渎" };
const cell = (src, label, wide) => `<div class="cell${wide?' wide':''}"><img src="${src}"><span>${label}</span></div>`;
document.getElementById('g-cur').innerHTML = Object.entries(A.currency).map(([k,v]) => cell(v, ZH[k]||k)).join('');
document.getElementById('g-omen').innerHTML = Object.entries(A.omens).map(([k,v]) => cell(v, k.replace(/^Omenof/,'').replace(/(?=[A-Z])/g,' '))).join('');
document.getElementById('g-ess').innerHTML = Object.entries(A.essences).map(([k,v]) => cell(v, k.replace(/_/g,' '))).join('');
// 每类武器抽 3 个
let wep = [];
for (const c of D.bases.classes) {
  for (const b of c.bases.filter(x => x.zh.indexOf('符文') < 0).slice(0,2)) {
    const p = A.weapons[c.id + '/' + b.id];
    if (p) wep.push(cell(p, c.zh + ' · ' + b.zh, true));
  }
  const rb = c.bases.find(x => x.zh.indexOf('符文') >= 0);
  const rp = rb && A.weapons[c.id + '/' + rb.id];
  if (rp) wep.push(cell(rp, c.zh + ' · ' + rb.zh, true));
}
document.getElementById('g-wep').innerHTML = wep.join('');
</script>
</body>
</html>
